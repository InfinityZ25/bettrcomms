[package]
name = "bettrcomms-sfu"
version = "0.1.0"
edition = "2024"
description = "Bettrcomms selective forwarding unit: forwards RTP/RTCP between WebRTC peers, no media transcoding, never touches Railway."
publish = false

[[bin]]
name = "bettrcomms-sfu"
path = "src/main.rs"

[dependencies]
# Sans-IO SFU core (forwards RTP/RTCP; owns ICE/DTLS/SRTP internally via `rtc`).
sfu = "0.5.0"
rtc = "0.21.0-rc.2"
sansio = "1.0.1"
bytes = "1"

# Async runtime + UDP/HTTP/WebSocket transport we drive the sans-IO core with.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace"] }

# Signaling wire format + join-token verification (HMAC, same scheme the
# existing Go API already uses for TURN credentials in server/internal/api/api.go).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["serde"] }

# Observability.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "unwind"
