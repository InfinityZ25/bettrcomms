[package]
name = "better-gui"
version = "0.1.0"
description = "Native desktop window controls for Tauri on Windows, macOS and Linux"
authors = ["ReachX Labs", "BetterComms contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "better_gui"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["wry"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
