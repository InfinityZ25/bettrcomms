version: '3'

# Task definitions for `wails3 dev`, `wails3 build`, and `wails3 package`.
#
# The equivalent PowerShell entry points in ../../scripts do the same work
# without requiring Task, and are the documented path in README.md. Keep the
# two in step if either changes.

vars:
  APP_NAME: bettercomms-wails
  BIN_DIR: bin
  WEB_DIR: ../web
  STAGED_DIST: frontend/dist

tasks:
  # Builds the shared frontend and stages it for `go:embed`. apps/web is the
  # single frontend source; this only copies its build output.
  build:frontend:
    dir: '{{.TASK_DIR}}'
    cmds:
      - wails3 generate bindings -ts -clean -d ../web/src/desktop/wailsbindings .
      - npm --prefix {{.WEB_DIR}} run build
      - powershell -NoProfile -ExecutionPolicy Bypass -File ../../scripts/stage-wails-frontend.ps1

  build:
    deps: [build:frontend]
    cmds:
      - go build -tags production -o {{.BIN_DIR}}/{{.APP_NAME}}.exe .

  # Development runs against the live Vite server rather than a staged copy, so
  # frontend edits reload without a Go rebuild.
  dev:
    env:
      BETTERCOMMS_DEV_SERVER: http://localhost:5173
    cmds:
      - go run .

  test:
    cmds:
      - go test ./...

  # The NVIDIA Audio Effects acceptance test. It skips unless this machine has
  # an NVIDIA Ada GPU and the pinned package unpacked into
  # the app-private NVIDIA runtime directory under LOCALAPPDATA, and says which
  # half is missing. Verbose because what it prints is the evidence: no NVIDIA
  # GPU has ever run this adapter, and the report says so until one has.
  test:nvidia:
    cmds:
      - go test ./internal/native/nvidiaaudio/ -v -run "Denoiser|Intensity|VoiceActivity|StoppingAndStarting"

  # The deepfilter package converts one C return value to a pointer, which is
  # the only way in Go to dereference memory a foreign library returned. Its
  # unsafeptr finding is expected and documented at the conversion; every other
  # analyzer still runs on it, and the full set runs everywhere else.
  vet:
    cmds:
      - go vet $(go list ./... | grep -v internal/native/deepfilter)
      - go vet -unsafeptr=false ./internal/native/deepfilter/
