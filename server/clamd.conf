# Optional local attachment scanner. Bind its Docker port to loopback only.
Foreground yes
LogTime yes
PidFile /tmp/clamd.pid
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
# Keep this synchronized with CLAMAV_MAX_SCAN_BYTES (500 MiB by default).
StreamMaxLength 500M
MaxFileSize 500M
MaxScanSize 1000M
MaxScanTime 120000
MaxRecursion 20
MaxFiles 10000
# Archive/encryption/size-limit failures are rejected rather than treated clean.
AlertExceedsMax yes
AlertEncrypted yes
ScanArchive yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanXMLDOCS yes
ScanHWP3 yes
