name: Experimental Wails Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-experimental.yml
      - apps/desktop-wails/**
      - apps/web/**
      - scripts/*android*
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - .github/workflows/android-experimental.yml
      - apps/desktop-wails/**
      - apps/web/**
      - scripts/*android*
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android arm, arm64 and x86_64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/desktop-wails/go.sum
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '14742923'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Assemble installable development APK and run Android checks
        env:
          ANDROID_ARCHS: arm arm64 amd64
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: bash scripts/package-desktop-wails-android.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bettercomms-android-development
          path: apps/desktop-wails/bin/*-android-*-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: android-check-reports
          path: apps/desktop-wails/android/app/build/reports/
