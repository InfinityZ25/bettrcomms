name: Experimental Wails iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ios-experimental.yml
      - apps/desktop-wails/**
      - apps/web/**
      - scripts/package-desktop-wails-ios.sh
      - scripts/patch-wails-ios-permissions.py
      - package-lock.json
  pull_request:
    paths:
      - .github/workflows/ios-experimental.yml
      - apps/desktop-wails/**
      - apps/web/**
      - scripts/package-desktop-wails-ios.sh
      - scripts/patch-wails-ios-permissions.py
      - package-lock.json

permissions:
  contents: read

jobs:
  ios-device:
    name: iOS arm64 device archive
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/desktop-wails/go.sum
      - run: npm ci
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.18
      - name: Build iPhoneOS archive and ad-hoc IPA
        run: bash scripts/package-desktop-wails-ios.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bettercomms-ios-arm64-device-adhoc
          path: apps/desktop-wails/bin/*-ios-arm64-adhoc.ipa
          if-no-files-found: error
          retention-days: 7
