name: Tauri macOS preview DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm ci --prefix apps/desktop
      - name: Build Tauri DMG
        run: npm --prefix apps/desktop run build -- --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
      - name: Repair app bundle signature and verify DMG
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          bash scripts/repair-tauri-macos-dmg.sh "${dmgs[0]}" "${dmgs[0]%.dmg}-preview.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: bettercomms-tauri-macos-${{ matrix.arch }}-preview
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*-preview.dmg
          if-no-files-found: error
