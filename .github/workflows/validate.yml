name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sfu-authorization:
    name: SFU authorization and revocation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Test media authorization lifecycle
        working-directory: apps/sfu
        run: cargo +1.96.0 test --locked
  wails-macos:
    name: Wails macOS package signature
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/desktop-wails/go.sum
      - run: npm ci
      - name: Test Wails host
        working-directory: apps/desktop-wails
        run: go test ./... && go vet ./...
      - name: Test native video encoder recovery policy
        run: bash scripts/test-video-encoder-recovery.sh
      - name: Package and verify macOS app
        run: |
          bash scripts/package-desktop-wails-macos.sh
          codesign --verify --deep --strict --verbose=2 apps/desktop-wails/bin/BetterComms.app
          test -s apps/desktop-wails/bin/*-macos-arm64.dmg
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' apps/desktop-wails/bin/BetterComms.app/Contents/Info.plist)" = appicon.icns
          test -s apps/desktop-wails/bin/BetterComms.app/Contents/Resources/appicon.icns
          mountpoint=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" apps/desktop-wails/bin/*-macos-arm64.dmg
          codesign --verify --deep --strict --verbose=2 "$mountpoint/BetterComms.app"
          hdiutil detach "$mountpoint"
          rmdir "$mountpoint"
  wails-windows:
    name: Wails Windows build and native contracts
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/desktop-wails/go.sum
      - name: Install frontend dependencies
        run: npm ci
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.18
      - name: Build and validate Wails with bundled FFmpeg
        run: ./scripts/build-desktop-wails.ps1
      - name: Verify bundled runtime without a private installation
        working-directory: apps/desktop-wails
        run: |
          $env:BETTERCOMMS_TEST_BUNDLE_DIR = Join-Path $PWD 'bin'
          go test -count=1 -v ./internal/native/ffmpegsetup -run 'TestBundledRuntime|TestStagedBundle'
      - name: Verify custom API origin survives packaging
        run: ./scripts/test-wails-build-origin.ps1
      # Hardware-dependent tests explicitly report missing devices/runtimes.
      # A hosted-runner pass does not establish NVIDIA/AMD or interactive UI acceptance.
      - name: Verify staged native assets match their checked-in sources
        working-directory: apps/desktop-wails
        run: go test -count=1 ./internal/native/dspsetup
      - name: Install NSIS packaging compiler
        run: |
          choco install nsis --version=3.11 --yes --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
      - name: Build per-user Wails installer
        run: ./scripts/package-desktop-wails.ps1 -SkipBuild -MakeNSIS "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
      - name: Verify install, locked payloads, upgrade and uninstall preservation
        run: |
          $version = (Get-Content apps/desktop-wails/package.json -Raw | ConvertFrom-Json).version
          ./scripts/test-wails-installer.ps1 -Installer "apps/desktop-wails/bin/bettercomms-wails-$version-windows-x64-setup.exe"
      - name: Keep the installer for PR testing (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: bettercomms-wails-windows-x64-installer
          path: apps/desktop-wails/bin/*-setup.exe
          if-no-files-found: error
          retention-days: 7
      - name: Keep the portable build for PR testing (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: bettercomms-wails-windows-x64-portable
          path: |
            apps/desktop-wails/bin/bettercomms-wails.exe
            apps/desktop-wails/bin/ffmpeg/
          if-no-files-found: error
          retention-days: 7
  browser-and-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bettercomms
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: bettercomms
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U bettercomms"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://bettercomms:local-development-only@127.0.0.1:54329/bettercomms?sslmode=disable
      TEST_DATABASE_URL: postgres://bettercomms:local-development-only@127.0.0.1:54329/bettercomms?sslmode=disable
      HTTP_ADDR: 127.0.0.1:8080
      APP_URL: http://localhost:5173
      DEV_AUTH: "true"
      E2E_BASE_URL: http://localhost:5173
      # Isolated, disposable test storage. These are local fixture credentials.
      AWS_S3_BUCKET: bettercomms-daily-test
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL_S3: http://127.0.0.1:19000
      AWS_ACCESS_KEY_ID: daily-local-only
      AWS_SECRET_ACCESS_KEY: daily-local-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: go test ./... && go vet ./...
        working-directory: server
      - run: npx playwright install --with-deps chromium webkit
      # The archived MinIO project distributes source only; historical image
      # digests can disappear. Keep this disposable fixture on verified source.
      - name: Cache pinned S3 fixture binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bettercomms-s3-bin
          key: minio-source-${{ runner.os }}-go1.26-9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
      - name: Start isolated S3-compatible attachment storage
        run: |
          set -euo pipefail
          # Official RELEASE.2025-10-15T17-29-55Z, commit 9e49d5e7a648.
          version=v0.0.0-20251015172955-9e49d5e7a648
          source_sum='h1:6TdolSCLSs2nwm8i0PpWDqf9iX2Ty9WQK8wmr7dCnUM='
          tool_dir="$RUNNER_TEMP/bettercomms-s3-bin"
          mkdir -p "$tool_dir" "$RUNNER_TEMP/bettercomms-s3-data"
          if [ ! -x "$tool_dir/minio" ]; then
            actual_sum=$(go mod download -json "github.com/minio/minio@$version" | jq -r '.Sum')
            test "$actual_sum" = "$source_sum"
            CGO_ENABLED=0 GOBIN="$tool_dir" go install "github.com/minio/minio@$version"
          fi
          go version -m "$tool_dir/minio" > "$RUNNER_TEMP/bettercomms-s3-build.txt"
          grep -F "$version" "$RUNNER_TEMP/bettercomms-s3-build.txt"
          grep -F "$source_sum" "$RUNNER_TEMP/bettercomms-s3-build.txt"
          MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            MINIO_BROWSER=off MINIO_UPDATE=off "$tool_dir/minio" server --quiet \
            --address 127.0.0.1:19000 --console-address 127.0.0.1:19001 \
            "$RUNNER_TEMP/bettercomms-s3-data" > "$RUNNER_TEMP/bettercomms-s3.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/bettercomms-s3.pid"
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/ready; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/bettercomms-s3.log"; exit 1; fi
          # Create through the real S3 API instead of relying on filesystem layout.
          curl --fail --silent --show-error \
            --aws-sigv4 "aws:amz:$AWS_REGION:s3" \
            --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
            --request PUT "$AWS_ENDPOINT_URL_S3/$AWS_S3_BUCKET"
      - name: Start local services
        run: |
          (cd server && go run ./cmd/server > /tmp/bettercomms-api.log 2>&1) &
          npm run dev > /tmp/bettercomms-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8080/healthz && curl --fail http://localhost:5173; then exit 0; fi
            sleep 1
          done
          cat /tmp/bettercomms-api.log /tmp/bettercomms-web.log
          exit 1
      - run: npm run test:e2e
      - name: Verify optimized phone layouts in Chromium and WebKit
        env:
          E2E_BASE_URL: http://localhost:5174
          BETTERCOMMS_API_TARGET: http://127.0.0.1:8081
          HTTP_ADDR: 127.0.0.1:8081
          APP_URL: http://localhost:5174
        run: |
          (cd server && go run ./cmd/server > /tmp/bettercomms-preview-api.log 2>&1) &
          npm exec --workspace apps/web -- vite preview --host 127.0.0.1 --port 5174 --strictPort > /tmp/bettercomms-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8081/healthz && curl --fail http://localhost:5174; then break; fi
            sleep 1
          done
          npx playwright test --config=playwright.production.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
      - name: Stop disposable S3 fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bettercomms-s3.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/bettercomms-s3.pid")" 2>/dev/null || true
          fi
