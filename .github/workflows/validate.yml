name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser-and-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bettercomms
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: bettercomms
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U bettercomms"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://bettercomms:local-development-only@127.0.0.1:54329/bettercomms?sslmode=disable
      TEST_DATABASE_URL: postgres://bettercomms:local-development-only@127.0.0.1:54329/bettercomms?sslmode=disable
      HTTP_ADDR: 127.0.0.1:8080
      APP_URL: http://localhost:5173
      DEV_AUTH: "true"
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: go test ./... && go vet ./...
        working-directory: server
      - run: npx playwright install --with-deps chromium
      - name: Start local services
        run: |
          (cd server && go run ./cmd/server > /tmp/bettercomms-api.log 2>&1) &
          npm run dev > /tmp/bettercomms-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8080/healthz && curl --fail http://localhost:5173; then exit 0; fi
            sleep 1
          done
          cat /tmp/bettercomms-api.log /tmp/bettercomms-web.log
          exit 1
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
