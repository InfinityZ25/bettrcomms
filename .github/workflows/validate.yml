name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  wails-windows:
    name: Wails Windows build and native contracts
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/desktop-wails/go.sum
      - name: Install frontend dependencies
        run: npm ci
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.18
      - name: Build and validate Wails with bundled FFmpeg
        run: ./scripts/build-desktop-wails.ps1
      - name: Verify bundled runtime without a private installation
        working-directory: apps/desktop-wails
        run: |
          $env:BETTERCOMMS_TEST_BUNDLE_DIR = Join-Path $PWD 'bin'
          go test -count=1 -v ./internal/native/ffmpegsetup -run 'TestBundledRuntime|TestStagedBundle'
      - name: Verify custom API origin survives packaging
        run: ./scripts/test-wails-build-origin.ps1
      # Hardware-dependent tests explicitly report missing devices/runtimes.
      # A hosted-runner pass does not establish NVIDIA/AMD or interactive UI acceptance.
      - name: Verify staged native assets match their checked-in sources
        working-directory: apps/desktop-wails
        run: go test -count=1 ./internal/native/dspsetup
      - name: Install NSIS packaging compiler
        run: |
          choco install nsis --version=3.11 --yes --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
      - name: Build per-user Wails installer
        run: ./scripts/package-desktop-wails.ps1 -SkipBuild -MakeNSIS "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
      - name: Verify install, locked payloads, upgrade and uninstall preservation
        run: |
          $version = (Get-Content apps/desktop-wails/package.json -Raw | ConvertFrom-Json).version
          ./scripts/test-wails-installer.ps1 -Installer "apps/desktop-wails/bin/bettercomms-wails-$version-windows-x64-setup.exe"
      - name: Keep the installer for PR testing (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: bettercomms-wails-windows-x64-installer
          path: apps/desktop-wails/bin/*-setup.exe
          if-no-files-found: error
          retention-days: 7
      - name: Keep the portable build for PR testing (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: bettercomms-wails-windows-x64-portable
          path: |
            apps/desktop-wails/bin/bettercomms-wails.exe
            apps/desktop-wails/bin/ffmpeg/
          if-no-files-found: error
          retention-days: 7
  browser-and-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bettercomms
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: bettercomms
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U bettercomms"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://bettercomms:local-development-only@127.0.0.1:54329/bettercomms?sslmode=disable
      TEST_DATABASE_URL: postgres://bettercomms:local-development-only@127.0.0.1:54329/bettercomms?sslmode=disable
      HTTP_ADDR: 127.0.0.1:8080
      APP_URL: http://localhost:5173
      DEV_AUTH: "true"
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: go test ./... && go vet ./...
        working-directory: server
      - run: npx playwright install --with-deps chromium
      - name: Start local services
        run: |
          (cd server && go run ./cmd/server > /tmp/bettercomms-api.log 2>&1) &
          npm run dev > /tmp/bettercomms-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8080/healthz && curl --fail http://localhost:5173; then exit 0; fi
            sleep 1
          done
          cat /tmp/bettercomms-api.log /tmp/bettercomms-web.log
          exit 1
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
