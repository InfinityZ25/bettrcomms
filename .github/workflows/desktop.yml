name: Desktop release bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bettercomms-windows-x64
            paths: |
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: bettercomms-macos-arm64
            paths: |
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: bettercomms-macos-x64
            paths: |
              apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      - name: Install web dependencies
        run: npm ci
      - name: Install desktop tooling
        run: npm ci --prefix apps/desktop
      - name: Require deployment-specific desktop configuration
        shell: bash
        run: test -f apps/desktop/src-tauri/tauri.release.conf.json
      - name: Prepare bundled native sharing runtime
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/prepare-ffmpeg-bundle.ps1
      - name: Build desktop bundle
        run: npm --prefix apps/desktop run build -- --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  # Artifacts on a workflow run expire (90 days) and aren't discoverable
  # from the repo's Releases page — easy to think a build never happened.
  # Only a tag push (an actual version, not an ad-hoc workflow_dispatch
  # build) gets turned into a permanent, linkable GitHub Release with the
  # installers attached directly.
  release:
    name: Publish GitHub release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bettercomms-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            See [docs/RELEASE_NOTES.md](https://github.com/${{ github.repository }}/blob/main/docs/RELEASE_NOTES.md) for what changed in this release.

            Unsigned, non-notarized builds — Windows SmartScreen and macOS Gatekeeper will warn on first launch.
