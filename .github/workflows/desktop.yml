name: Wails application release

on:
  workflow_dispatch:
  push:
    tags:
      - "wails-v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/desktop-wails/go.sum
      - run: npm ci
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.18
      - name: Build and test Wails host
        run: ./scripts/build-desktop-wails.ps1 -ApiOrigin https://app.bettrcomms.com
      - name: Install NSIS
        run: |
          choco install nsis --version=3.11 --yes --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
      - name: Package installer
        run: ./scripts/package-desktop-wails.ps1 -SkipBuild -MakeNSIS "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
      - name: Verify installer
        run: |
          $version = (Get-Content apps/desktop-wails/package.json -Raw | ConvertFrom-Json).version
          ./scripts/test-wails-installer.ps1 -Installer "apps/desktop-wails/bin/bettercomms-wails-$version-windows-x64-setup.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bettercomms-wails-windows-x64
          path: apps/desktop-wails/bin/*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/desktop-wails/go.sum
      - run: npm ci
      - name: Test Wails host
        working-directory: apps/desktop-wails
        run: |
          go vet ./...
          go test ./...
      - name: Package macOS app
        run: bash scripts/package-desktop-wails-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bettercomms-wails-macos-${{ matrix.arch }}
          path: apps/desktop-wails/bin/*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  ios:
    name: iOS arm64 re-signable IPA
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/desktop-wails/go.sum
      - run: npm ci
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.18
      - name: Package experimental iPhone app
        run: bash scripts/package-desktop-wails-ios.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bettercomms-wails-ios-arm64
          path: apps/desktop-wails/bin/*-ios-arm64-adhoc.ipa
          if-no-files-found: error

  release:
    name: Publish latest release
    if: startsWith(github.ref, 'refs/tags/wails-v')
    needs: [windows, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check tag matches Wails package version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop-wails/package.json').version")
          test "${GITHUB_REF_NAME}" = "wails-v${version}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bettercomms-wails-*
          path: release-assets
          merge-multiple: true
      - name: Generate package checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --latest --title "BetterComms ${GITHUB_REF_NAME#wails-v}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME#wails-v}.md"
