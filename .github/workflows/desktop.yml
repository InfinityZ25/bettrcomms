name: Desktop release bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bettercomms-windows-x64
            paths: |
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: bettercomms-macos-arm64
            paths: |
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: bettercomms-macos-x64
            paths: |
              apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      - name: Install web dependencies
        run: npm ci
      - name: Install desktop tooling
        run: npm ci --prefix apps/desktop
      - name: Require deployment-specific desktop configuration
        shell: bash
        run: test -f apps/desktop/src-tauri/tauri.release.conf.json
      - name: Build desktop bundle
        run: npm --prefix apps/desktop run build -- --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
